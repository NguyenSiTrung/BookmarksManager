name: CI

# Runs on feature work (pull requests) and on published releases. Deliberately
# NOT on pushes to `main`, so merges to main do not spend CI on every commit.
on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Routine PR verification never needs write access or repository secrets.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build extension
        run: npm run build

      - name: Check manifest permissions match store/permissions.md
        run: npm run check:manifest

      - name: Check bundle for eval / remote scripts
        run: npm run check:bundle

      - name: Check static site and policy consistency
        run: npm run check:site

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # tests/e2e/shell.spec.ts launches a headed (headless: false) persistent
      # context so MV3 service workers and extension pages behave like a real
      # install, so CI needs a virtual display.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: E2E smoke test (headed, under Xvfb)
        run: xvfb-run -a npm run test:e2e

  # Release-strict store/packaging gate (Phase 6): keyless (no secrets), but it
  # asserts the final version bump, assets, and release record, so it runs only
  # for a published release or a manual dispatch — never on routine pull
  # requests.
  release-checks:
    needs: quality
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Store-readiness gate
        run: npm run check:store
