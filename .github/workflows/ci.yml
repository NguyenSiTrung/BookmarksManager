name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build extension
        run: npm run build

      - name: Check manifest permissions match store/permissions.md
        run: npm run check:manifest

      - name: Check bundle for eval / remote scripts
        run: npm run check:bundle

      # Release-strict store gate (Phase 6): runs keyless against local files
      # and fails until the version bump, assets, and release record land.
      - name: Store-readiness gate
        run: npm run check:store

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # tests/e2e/shell.spec.ts launches a headed (headless: false) persistent
      # context so MV3 service workers and extension pages behave like a real
      # install, so CI needs a virtual display.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: E2E smoke test (headed, under Xvfb)
        run: xvfb-run -a npm run test:e2e
